# freedesktop.wayland-protocols-stable — the stable extension protocols.
#
# WHAT UPSTREAM SHIPS, AND WHY A FORK
#
# wayland-protocols is XML and nothing else: 65 files under stable/, staging/,
# unstable/ and experimental/, plus a pkg-config file naming the directory. A
# consumer runs wayland-scanner over the ones it uses and compiles the result
# itself; there is no library to link and no header to include until someone
# generates them. A plain inline descriptor has nothing to compile, so the
# generator runs once here and the output is checked in — the same shape as
# freedesktop.wayland's own protocol code.
#
# ─────────────────────────────────────────────────────────────────────────
# WHY ONE PACKAGE PER TIER, AND NOT ONE FOR ALL 65
#
# Because all 65 in one library DOES NOT LINK, and that is measured rather than
# feared: the scanner emits the same symbol names for a protocol's stable and
# unstable spellings.
#
#     multiple definition of `zwp_linux_dmabuf_v1_interface'
#
# Counted, per exported `wl_interface`:
#
#     stable  n staging  =  0        stable   21 exports
#     stable  n unstable = 13        staging  76
#     staging n unstable =  0        unstable 69
#
# So the tier is the boundary along which they coexist, and it is upstream's
# own directory structure rather than a split invented here.
#
# THE COST WAS MEASURED BEFORE SHIPPING A WHOLE TIER. mcpp links a dependency's
# objects into the consumer. All 65 protocols compile to 270 KB of
# `wl_interface` tables — 4 KB each — and the bulk of the tree is HEADERS,
# which cost nothing until included. Splitting per protocol would mean 65
# packages for 270 KB.
# ⚠️ VERSION 1.49.1 — the third component is THIS FORK's revision, not
# upstream's. wayland-protocols releases two-component versions and 1.49 is the
# newest one; 1.49.1 is 1.49's XML plus the `wayland-protocols/<name>-enum.h`
# headers that upstream's own meson installs and this fork did not previously
# generate. wlroots 0.20 needs them in ten of its PUBLIC headers, so they have
# to be reachable by a consumer writing a plain `#include <wlr/...>`.
#
# ⭐ Why the enum headers must be CHECKED IN rather than produced by a
# `build.mcpp` the way §14 of the design doc otherwise prescribes: measured
# 2026-08-31, `mcpp::include_dir()` from a build program is PACKAGE-PRIVATE —
# a consumer does not see it — while `[build] include_dirs` in the manifest
# does propagate. A package whose product IS headers therefore cannot generate
# them at build time.
#
# Why a new version rather than re-cutting 1.49: the mcpp store is keyed by
# (name, version) and does not re-extract a version it already holds, so a
# re-cut tag never reaches anyone who already built against it — while the tag
# archive's sha256 changes under every published descriptor. Additive content,
# additive version.
[package]
namespace   = "freedesktop"
name        = "wayland-protocols-stable"
version     = "1.49.1"
standard    = "c++23"
description = "wayland-protocols stable — xdg-shell, linux-dmabuf-v1, tablet-v2, viewporter, presentation-time"
license     = "MIT"
repo        = "https://gitlab.freedesktop.org/wayland/wayland-protocols"

[build]
# Written out rather than globbed: a glob would silently absorb whatever a
# regeneration left behind, and this list is what CI diffs against the
# scanner's output.
sources = [
    "../generated/linux-dmabuf-v1-protocol.c",
    "../generated/presentation-time-protocol.c",
    "../generated/tablet-v2-protocol.c",
    "../generated/viewporter-protocol.c",
    "../generated/xdg-shell-protocol.c",
]

# The generated headers ARE the public interface — a consumer writes
# `#include <xdg-shell-client-protocol.h>` — so the directory is exposed
# rather than kept build-private. freedesktop.wayland had exactly this bug
# once, masked locally by a header the SubOS happened to carry.
include_dirs = ["../generated"]

cflags = ["-D_GNU_SOURCE", "-fPIC"]

# kind = "lib", not "shared", and that matches upstream: there is no
# libwayland-protocols.so anywhere, because the marshalling tables are meant to
# be compiled INTO the program that uses them. A shared library here would
# invent an ABI upstream does not have.
[targets.wayland_protocols_stable]
kind = "lib"

[dependencies]
# Every `*-client-protocol.h` includes <wayland-client-core.h>; the server
# headers the server equivalent.
freedesktop.wayland        = "1.26.0"
freedesktop.wayland-server = "1.26.0"

